<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="819" cy="-76" r="66" fill="#6d28d9" opacity="0.19"/>
    <circle cx="-71" cy="330" r="62" fill="#6d28d9" opacity="0.09"/>
    <circle cx="796" cy="256" r="40" fill="#6d28d9" opacity="0.07"/>
    <circle cx="97" cy="277" r="35" fill="#6d28d9" opacity="0.13"/>
    <circle cx="527" cy="250" r="91" fill="#6d28d9" opacity="0.12"/>
    <circle cx="237" cy="275" r="87" fill="#6d28d9" opacity="0.08"/>
    <rect x="35" y="110" width="38" height="31" rx="8" fill="#7c3aed" opacity="0.09" transform="rotate(38, 618, 537)"/>
    <rect x="879" y="472" width="77" height="56" rx="8" fill="#7c3aed" opacity="0.15" transform="rotate(20, 941, 616)"/>
    <rect x="660" y="108" width="90" height="95" rx="8" fill="#7c3aed" opacity="0.06" transform="rotate(8, 757, 433)"/>
    <rect x="298" y="601" width="58" height="21" rx="8" fill="#7c3aed" opacity="0.06" transform="rotate(38, 212, -27)"/>
    <rect x="550" y="231" width="25" height="82" rx="8" fill="#7c3aed" opacity="0.15" transform="rotate(19, 352, 152)"/>
    <rect x="430" y="383" width="20" height="23" rx="8" fill="#7c3aed" opacity="0.03" transform="rotate(13, 440, -3)"/>
    <rect x="1148" y="137" width="37" height="54" rx="8" fill="#7c3aed" opacity="0.03" transform="rotate(37, 1191, 253)"/>
    <rect x="533" y="201" width="43" height="33" rx="8" fill="#7c3aed" opacity="0.08" transform="rotate(19, 243, 558)"/>
    <polygon points="1107,247 1156,345 1058,345" fill="#6d28d9" opacity="0.09"/>
    <polygon points="1286,401 1315,459 1257,459" fill="#6d28d9" opacity="0.08"/>
    <polygon points="1016,33 1060,121 972,121" fill="#6d28d9" opacity="0.11"/>
    <polygon points="1176,299 1199,345 1153,345" fill="#6d28d9" opacity="0.06"/>

  <!-- Wave at bottom -->
  <path d="M0,538 C360,584 840,492 1200,538 L1200,630 L0,630Z" fill="#6d28d9" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 마사지 링크
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 마사지
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#f472b6" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 마포 마사지 링크 — 마사지
  </text>
</svg>